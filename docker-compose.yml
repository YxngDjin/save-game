services:
  savegame-server:
    build: 
      context: .
      dockerfile: server/Dockerfile
    container_name: savegame-server
    restart: unless-stopped
    ports:
      - "${SAVEGAME_PORT:-3000}:3000"
    environment:
      - ADMIN_KEY=${ADMIN_KEY:?ADMIN_KEY muss gesetzt sein}
      - TZ=Europe/Berlin
      - RETENTION_COUNT=${RETENTION_COUNT:-10}
    volumes:
      - savegame-data:/data

volumes:
  savegame-data: