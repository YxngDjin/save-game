services:
  savegame-server:
    build: ./server
    container_name: savegame-server
    restart: unless-stopped
    ports:
      - "${SAVEGAME_PORT:-3000}:3000"
    environment:
      - ADMIN_KEY=${ADMIN_KEY:?ADMIN_KEY muss gesetzt sein}
      - TZ=Europe/Berlin
    volumes:
      - savegame-data:/data

volumes:
  savegame-data: